        // Global State variables
        let searchQuery = "";
        let collapsedStates = new Set();

        // DOM Element references
        const statesContainer = document.getElementById('states-container');
        const searchInput = document.getElementById('search-input');
        const clearSearchBtn = document.getElementById('clear-search');
        const statStates = document.getElementById('stat-states');
        const statCities = document.getElementById('stat-cities');
        const noResults = document.getElementById('no-results');
        const darkToggle = document.getElementById('dark-toggle');
        const darkToggleMobile = document.getElementById('dark-toggle-mobile');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        // Theme Setup
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }

        darkToggle.addEventListener('click', toggleTheme);
        darkToggleMobile.addEventListener('click', toggleTheme);

        let toastTimeout;
        function showToast(text) {
            toastMessage.textContent = text;
            toast.classList.remove('translate-y-24', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 3000);
        }

        // Copy functionality appending 'driving tour'
        function copyText(text) {
            const formattedText = `${text} driving tour`;
            
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(formattedText).then(() => {
                    showToast(`Copied '${formattedText}' to clipboard!`);
                }).catch(() => fallbackCopy(formattedText));
            } else {
                fallbackCopy(formattedText);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast(`Copied '${text}' to clipboard!`);
            } catch (err) {
                showToast('Failed to copy');
            }
            document.body.removeChild(textArea);
        }

        function copyAllStateCities(stateName) {
            const stateObj = usStatesData.find(s => s.state === stateName);
            if (!stateObj) return;
            const formattedList = stateObj.cities.map(c => `${c} driving tour`).join('\n');
            
            const textArea = document.createElement("textarea");
            textArea.value = formattedList;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast(`Copied all cities for ${stateName}!`);
            } catch (err) {
                showToast('Failed to copy');
            }
            document.body.removeChild(textArea);
        }

        function openYouTubeSearch(query) {
            const encodedQuery = encodeURIComponent(`${query} driving tour`);
            window.open(`https://www.youtube.com/results?search_query=${encodedQuery}`, '_blank', 'noopener,noreferrer');
        }

        function toggleStateCollapse(stateName) {
            if (collapsedStates.has(stateName)) {
                collapsedStates.delete(stateName);
            } else {
                collapsedStates.add(stateName);
            }
            renderDashboard();
        }

        document.getElementById('expand-all-btn').addEventListener('click', () => {
            collapsedStates.clear();
            renderDashboard();
        });

        document.getElementById('collapse-all-btn').addEventListener('click', () => {
            usStatesData.forEach(s => collapsedStates.add(s.state));
            renderDashboard();
        });

        function renderDashboard() {
            let visibleStatesCount = 0;
            let visibleCitiesCount = 0;
            let html = '';

            const isSearching = searchQuery.trim().length > 0;
            const query = searchQuery.toLowerCase().trim();

            usStatesData.forEach((stateData, index) => {
                const stateMatches = stateData.state.toLowerCase().includes(query);
                const matchingCities = stateData.cities.filter(city => 
                    city.toLowerCase().includes(query) || stateMatches
                );

                if (matchingCities.length === 0) return;

                visibleStatesCount++;
                visibleCitiesCount += matchingCities.length;

                const isCollapsed = !isSearching && collapsedStates.has(stateData.state);
                const escapedState = stateData.state.replace(/'/g, "\\'");

                html += `
                    <div class="bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm hover:shadow-md transition-all duration-200 overflow-hidden">
                        
                        <!-- State Header -->
                        <div class="p-4 sm:p-5 bg-slate-50/60 dark:bg-slate-800/40 border-b border-slate-100 dark:border-slate-700/60 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                            
                            <div class="flex items-center space-x-3 cursor-pointer select-none" onclick="toggleStateCollapse('${escapedState}')">
                                <button aria-label="Toggle collapse" class="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-sm transition-transform duration-200 ${isCollapsed ? '' : 'rotate-90'}">
                                    <i class="fa-solid fa-chevron-right"></i>
                                </button>
                                <span class="flex items-center justify-center w-8 h-8 rounded-xl bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 font-extrabold text-xs">
                                    ${index + 1}
                                </span>
                                <div class="flex items-center space-x-2">
                                    <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100">${stateData.state}</h2>
                                    <span class="px-2.5 py-0.5 text-xs font-semibold bg-blue-100 dark:bg-blue-950/80 text-blue-700 dark:text-blue-300 rounded-full">
                                        ${matchingCities.length} ${matchingCities.length === 1 ? 'city' : 'cities'}
                                    </span>
                                </div>
                            </div>

                            <!-- State Direct Action Buttons -->
                            <div class="flex items-center gap-2">
                                <button onclick="copyText('${escapedState}')" 
                                    class="flex-1 sm:flex-initial px-3.5 py-2 text-xs font-semibold bg-white dark:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-600 rounded-xl transition-colors flex items-center justify-center gap-2 shadow-xs">
                                    <i class="fa-regular fa-copy text-slate-400"></i> Copy State
                                </button>
                                <button onclick="copyAllStateCities('${escapedState}')" 
                                    class="flex-1 sm:flex-initial px-3.5 py-2 text-xs font-semibold bg-white dark:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-600 rounded-xl transition-colors flex items-center justify-center gap-2 shadow-xs">
                                    <i class="fa-solid fa-list-check text-slate-400"></i> Copy All Cities
                                </button>
                                <button onclick="openYouTubeSearch('${escapedState}')" 
                                    class="flex-1 sm:flex-initial px-3.5 py-2 text-xs font-semibold bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-900/50 hover:bg-red-100 dark:hover:bg-red-900/60 rounded-xl transition-colors flex items-center justify-center gap-2 shadow-xs">
                                    <i class="fa-brands fa-youtube text-red-500"></i> Tour
                                </button>
                            </div>
                        </div>

                        <!-- City Grid Content -->
                        <div class="${isCollapsed ? 'hidden' : 'block'} p-4 sm:p-5">
                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                                ${matchingCities.map(city => {
                                    const escapedCity = city.replace(/'/g, "\\'");
                                    return `
                                        <div class="group relative flex items-center justify-between p-3 rounded-xl bg-slate-50/80 dark:bg-slate-900/50 hover:bg-blue-50/60 dark:hover:bg-slate-700/60 border border-slate-200/60 dark:border-slate-800 transition-all duration-150">
                                            
                                            <!-- City Name Button -->
                                            <button onclick="copyText('${escapedCity}')" 
                                                title="Click to copy '${city} driving tour'" 
                                                class="flex-1 text-left font-medium text-xs sm:text-sm text-slate-700 dark:text-slate-200 hover:text-blue-600 dark:hover:text-blue-400 truncate mr-2 flex items-center gap-1.5">
                                                <i class="fa-solid fa-location-dot text-slate-300 dark:text-slate-600 text-xs"></i>
                                                <span class="truncate">${city}</span>
                                            </button>

                                            <!-- City Action Buttons -->
                                            <div class="flex items-center space-x-1 shrink-0">
                                                <button onclick="copyText('${escapedCity}')" 
                                                    title="Copy '${city} driving tour'"
                                                    class="p-1.5 text-slate-400 hover:text-slate-700 dark:hover:text-slate-100 hover:bg-white dark:hover:bg-slate-800 rounded-lg transition-colors text-xs">
                                                    <i class="fa-regular fa-copy"></i>
                                                </button>
                                                <button onclick="openYouTubeSearch('${escapedCity}')" 
                                                    title="Search '${city} driving tour' on YouTube"
                                                    class="p-1.5 text-red-500 hover:text-red-600 dark:text-red-400 hover:bg-white dark:hover:bg-slate-800 rounded-lg transition-colors text-xs">
                                                    <i class="fa-brands fa-youtube"></i>
                                                </button>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
            });

            statesContainer.innerHTML = html;

            // Update state metrics
            statStates.textContent = visibleStatesCount;
            statCities.textContent = visibleCitiesCount;

            if (visibleStatesCount === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
            }
        }

        // Search listeners
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            if (searchQuery.trim().length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }
            renderDashboard();
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            clearSearchBtn.classList.add('hidden');
            renderDashboard();
        });

        // Initialize App on DOM Load
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderDashboard();
        });
    </script>
</body>
</html>
