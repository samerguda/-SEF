  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --yt-red: #ff0000;
      --yt-hover: #cc0000;
      --city-btn-bg: #334155;
      --city-btn-hover: #475569;
      --toast-bg: #0284c7;
      --toast-text: #ffffff;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --accent-glow: rgba(2, 132, 199, 0.1);
      --city-btn-bg: #f1f5f9;
      --city-btn-hover: #e2e8f0;
      --toast-bg: #0f172a;
      --toast-text: #ffffff;
      --shadow-sm: 0 2px 4px 0 rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Tajawal', sans-serif;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .header-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    @media (min-width: 768px) {
      .header-container {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.5rem;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }

    .logo-text h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--text-main), var(--accent-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-text p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      flex-grow: 1;
      min-width: 240px;
    }

    .search-box i {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-input {
      width: 100%;
      padding: 0.75rem 2.75rem 0.75rem 1rem;
      background-color: var(--bg-primary);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn-action {
      background-color: var(--bg-primary);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.75rem 1rem;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
    }

    .btn-action:hover {
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      flex-grow: 1;
      width: 100%;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding: 1rem 1.5rem;
      background: var(--bg-secondary);
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }

    .stats-info {
      display: flex;
      gap: 1.5rem;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .stats-info span strong {
      color: var(--accent-color);
    }

    .countries-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 1.5rem;
    }

    .country-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
    }

    .country-header {
      padding: 1.25rem;
      background-color: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .country-title-area {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .country-num {
      background: var(--accent-glow);
      color: var(--accent-color);
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .country-name {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      direction: ltr;
    }

    .country-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn:hover {
      background: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    .icon-btn.yt-btn:hover {
      background: var(--yt-red);
      border-color: var(--yt-red);
    }

    .cities-list {
      padding: 1.25rem;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.6rem;
      direction: ltr;
    }

    .city-item {
      background-color: var(--city-btn-bg);
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .city-item:hover {
      background-color: var(--city-btn-hover);
      border-color: var(--card-border);
    }

    .city-name {
      font-size: 0.88rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .city-actions {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      opacity: 0.8;
    }

    .city-item:hover .city-actions {
      opacity: 1;
    }

    .city-action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    .city-action-btn:hover {
      color: var(--accent-color);
    }

    .city-action-btn.yt:hover {
      color: var(--yt-red);
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background-color: var(--toast-bg);
      color: var(--toast-text);
      padding: 0.85rem 1.5rem;
      border-radius: 30px;
      box-shadow: var(--shadow-lg);
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      z-index: 1000;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      direction: ltr;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      border-top: 1px solid var(--card-border);
      margin-top: auto;
    }
  </style>
</head>

      { id: 51, name: "Abkhazia", cities: ["Sukhumi", "Gagra", "Gudauta", "Ochamchire", "Tkvarcheli", "Gali", "New Athos", "Pitsunda", "Gulripshi", "Bzyb", "Dranda", "Alakhadzy"] },
      { id: 52, name: "South Ossetia", cities: ["Tskhinvali", "Java", "Kvaisi", "Akhalgori", "Znaur", "Tamarasheni", "Kurta", "Eredvi", "Dmenisi", "Dzau", "Khetagurovo", "Tbeti"] }
    ];

    function renderCards(data) {
      const container = document.getElementById('countriesGrid');
      container.innerHTML = '';

      let totalCities = 0;

      data.forEach(item => {
        totalCities += item.cities.length;

        const card = document.createElement('div');
        card.className = 'country-card';

        const safeCountry = item.name.replace(/'/g, "\\'");

        const citiesHtml = item.cities.map(city => {
          const safeCity = city.replace(/'/g, "\\'");
          return `
            <div class="city-item">
              <span class="city-name">${city}</span>
              <div class="city-actions">
                <button class="city-action-btn" title="Copy '${city} driving tour'" onclick="copyText('${safeCity} driving tour')">
                  <i class="fa-regular fa-copy"></i>
                </button>
                <button class="city-action-btn yt" title="Search driving tour on YouTube" onclick="openYT('${safeCity} driving tour')">
                  <i class="fa-brands fa-youtube"></i>
                </button>
              </div>
            </div>
          `;
        }).join('');

        card.innerHTML = `
          <div class="country-header">
            <div class="country-title-area">
              <span class="country-num">${item.id}</span>
              <h2 class="country-name">${item.name}</h2>
            </div>
            <div class="country-actions">
              <button class="icon-btn" title="Copy '${item.name} driving tour'" onclick="copyText('${safeCountry} driving tour')">
                <i class="fa-regular fa-copy"></i>
              </button>
              <button class="icon-btn yt-btn" title="Search country driving tours" onclick="openYT('${safeCountry} driving tour')">
                <i class="fa-brands fa-youtube"></i>
              </button>
            </div>
          </div>
          <div class="cities-list">
            ${citiesHtml}
          </div>
        `;

        container.appendChild(card);
      });

      document.getElementById('countryCount').textContent = data.length;
      document.getElementById('cityCount').textContent = totalCities;
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`Copied: "${text}"`);
      }).catch(err => {
        showToast(`Failed to copy`);
      });
    }

    function openYT(query) {
      const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
      window.open(url, '_blank');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const btn = document.getElementById('themeToggleBtn');
      if (currentTheme === 'light') {
        document.documentElement.setAttribute('data-theme', 'dark');
        btn.innerHTML = '<i class="fa-solid fa-moon"></i>';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        btn.innerHTML = '<i class="fa-solid fa-sun"></i>';
      }
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase().trim();
      if (!term) {
        renderCards(countriesData);
        return;
      }

      const filtered = countriesData.map(c => {
        const countryMatches = c.name.toLowerCase().includes(term);
        const matchingCities = c.cities.filter(city => city.toLowerCase().includes(term));

        if (countryMatches) {
          return c;
        } else if (matchingCities.length > 0) {
          return { ...c, cities: matchingCities };
        }
        return null;
      }).filter(Boolean);

      renderCards(filtered);
    });

    renderCards(countriesData);
  </script>
</body>
</html>
