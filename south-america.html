<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travelling - South America</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 9999px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

    <header class="sticky top-0 z-40 bg-white/85 dark:bg-slate-900/85 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm transition-colors">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                
                <!-- Logo & Main Title -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="p-2.5 bg-gradient-to-tr from-emerald-500 via-teal-500 to-cyan-500 text-white rounded-2xl shadow-lg shadow-emerald-500/20 flex items-center justify-center">
                            <i class="fa-solid fa-compass text-2xl animate-pulse"></i>
                        </div>
                        <div>
                            <h1 class="text-2xl font-black tracking-tight bg-gradient-to-r from-emerald-600 via-teal-600 to-cyan-600 dark:from-emerald-400 dark:via-teal-400 dark:to-cyan-400 bg-clip-text text-transparent">
                                Travelling - South America
                            </h1>
                            <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Virtual Driving Tour Directory</p>
                        </div>
                    </div>

                    <!-- Mobile Theme Controls -->
                    <div class="flex items-center gap-2 md:hidden">
                        <button id="dark-toggle-mobile" aria-label="Toggle dark mode" class="p-2.5 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors">
                            <i class="fa-solid fa-moon dark:hidden text-lg"></i>
                            <i class="fa-solid fa-sun hidden dark:block text-amber-400 text-lg"></i>
                        </button>
                    </div>
                </div>

                <!-- Search Input & Desktop Controls -->
                <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                    <div class="relative flex-1 sm:w-80">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="search-input" placeholder="Search country or city..." 
                            class="w-full pl-10 pr-10 py-2.5 bg-slate-100 dark:bg-slate-800/80 border border-transparent focus:border-emerald-500 dark:focus:border-emerald-400 rounded-xl text-sm transition-all outline-none focus:ring-2 focus:ring-emerald-500/20 text-slate-800 dark:text-slate-100 placeholder-slate-400">
                        <button id="clear-search" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <!-- Desktop Dark/Light Toggle Button -->
                    <button id="dark-toggle" aria-label="Toggle theme" class="hidden md:flex items-center justify-center p-2.5 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 rounded-xl transition-colors">
                        <i class="fa-solid fa-moon dark:hidden text-lg"></i>
                        <i class="fa-solid fa-sun hidden dark:block text-amber-400 text-lg"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Summary & Quick Stats Bar -->
        <div class="bg-white dark:bg-slate-800/90 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 sm:p-5 mb-8 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-4 sm:gap-6">
                <div class="flex items-center space-x-3">
                    <div class="p-2.5 bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 rounded-xl">
                        <i class="fa-solid fa-earth-americas text-xl"></i>
                    </div>
                    <div>
                        <span class="text-xs text-slate-500 dark:text-slate-400 font-medium block">Total Region</span>
                        <span class="font-bold text-slate-800 dark:text-slate-100 text-sm">South America</span>
                    </div>
                </div>
                
                <div class="h-8 w-px bg-slate-200 dark:bg-slate-700/60 hidden sm:block"></div>

                <div class="flex items-center space-x-3">
                    <div class="p-2.5 bg-teal-50 dark:bg-teal-950/50 text-teal-600 dark:text-teal-400 rounded-xl">
                        <i class="fa-solid fa-flag text-xl"></i>
                    </div>
                    <div>
                        <span class="text-xs text-slate-500 dark:text-slate-400 font-medium block">Countries</span>
                        <span id="stat-countries" class="font-bold text-slate-800 dark:text-slate-100 text-sm">12</span>
                    </div>
                </div>

                <div class="h-8 w-px bg-slate-200 dark:bg-slate-700/60 hidden sm:block"></div>

                <div class="flex items-center space-x-3">
                    <div class="p-2.5 bg-cyan-50 dark:bg-cyan-950/50 text-cyan-600 dark:text-cyan-400 rounded-xl">
                        <i class="fa-solid fa-city text-xl"></i>
                    </div>
                    <div>
                        <span class="text-xs text-slate-500 dark:text-slate-400 font-medium block">Cities Total</span>
                        <span id="stat-cities" class="font-bold text-slate-800 dark:text-slate-100 text-sm">144</span>
                    </div>
                </div>
            </div>

            <!-- Global Actions -->
            <div class="flex items-center gap-2 pt-2 md:pt-0 border-t md:border-t-0 border-slate-100 dark:border-slate-800">
                <button id="expand-all-btn" class="px-3.5 py-2 text-xs font-semibold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-700/60 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition-colors border border-slate-200 dark:border-slate-600 flex items-center gap-1.5">
                    <i class="fa-solid fa-angles-down text-slate-400"></i> Expand All
                </button>
                <button id="collapse-all-btn" class="px-3.5 py-2 text-xs font-semibold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-700/60 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition-colors border border-slate-200 dark:border-slate-600 flex items-center gap-1.5">
                    <i class="fa-solid fa-angles-up text-slate-400"></i> Collapse All
                </button>
            </div>
        </div>

        <div id="countries-container" class="space-y-8">
            <!-- Dynamically Populated with JavaScript -->
        </div>

        <!-- No Results Fallback View -->
        <div id="no-results" class="hidden text-center py-20 bg-white dark:bg-slate-800/40 rounded-3xl border border-slate-200 dark:border-slate-800 my-8">
            <div class="inline-flex p-4 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-500 rounded-full mb-4">
                <i class="fa-solid fa-magnifying-glass-location text-4xl"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-800 dark:text-slate-100">No matching destinations found</h3>
            <p class="text-sm text-slate-500 dark:text-slate-400 max-w-md mx-auto mt-2">Try searching for another country or city in South America.</p>
        </div>
    </main>

    <div id="toast" class="fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-3.5 bg-slate-900 dark:bg-white text-white dark:text-slate-900 rounded-2xl shadow-2xl transition-all duration-300 transform translate-y-24 opacity-0 border border-slate-800 dark:border-slate-200 max-w-sm">
        <div class="p-1.5 bg-emerald-500 text-white dark:bg-emerald-600 rounded-lg flex items-center justify-center shrink-0">
            <i class="fa-solid fa-check text-xs"></i>
        </div>
        <div class="flex-1 min-w-0">
            <p id="toast-message" class="text-xs font-semibold truncate">Copied to clipboard!</p>
        </div>
    </div>

    <script>
        // Data Structure for South America
        const southAmericaData = [
            {
                flag: "🇦🇷",
                country: "Argentina",
                cities: ["Buenos Aires", "Córdoba", "Rosario", "Mendoza", "La Plata", "Mar del Plata", "Salta", "Santa Fe", "San Miguel de Tucumán", "San Juan", "Neuquén", "Ushuaia"]
            },
            {
                flag: "🇧🇴",
                country: "Bolivia",
                cities: ["La Paz", "Santa Cruz de la Sierra", "Cochabamba", "Sucre", "Oruro", "Potosí", "Tarija", "Trinidad", "Cobija", "Montero", "Riberalta", "Yacuiba"]
            },
            {
                flag: "🇧🇷",
                country: "Brazil",
                cities: ["São Paulo", "Rio de Janeiro", "Brasília", "Salvador", "Fortaleza", "Belo Horizonte", "Manaus", "Curitiba", "Recife", "Porto Alegre", "Belém", "Florianópolis"]
            },
            {
                flag: "🇨🇱",
                country: "Chile",
                cities: ["Santiago", "Valparaíso", "Viña del Mar", "Concepción", "Antofagasta", "La Serena", "Temuco", "Puerto Montt", "Iquique", "Rancagua", "Arica", "Punta Arenas"]
            },
            {
                flag: "🇨🇴",
                country: "Colombia",
                cities: ["Bogotá", "Medellín", "Cali", "Barranquilla", "Cartagena", "Bucaramanga", "Santa Marta", "Pereira", "Manizales", "Cúcuta", "Armenia", "Ibagué"]
            },
            {
                flag: "🇪🇨",
                country: "Ecuador",
                cities: ["Quito", "Guayaquil", "Cuenca", "Santo Domingo", "Machala", "Manta", "Loja", "Ambato", "Riobamba", "Portoviejo", "Esmeraldas", "Ibarra"]
            },
            {
                flag: "🇬🇾",
                country: "Guyana",
                cities: ["Georgetown", "Linden", "New Amsterdam", "Bartica", "Anna Regina", "Skeldon", "Corriverton", "Rose Hall", "Lethem", "Mahdia", "Essequibo", "Mabaruma"]
            },
            {
                flag: "🇵🇾",
                country: "Paraguay",
                cities: ["Asunción", "Ciudad del Este", "San Lorenzo", "Luque", "Capiatá", "Lambaré", "Fernando de la Mora", "Encarnación", "Pedro Juan Caballero", "Mariano Roque Alonso", "Limpio", "Caaguazú"]
            },
            {
                flag: "🇵🇪",
                country: "Peru",
                cities: ["Lima", "Arequipa", "Cusco", "Trujillo", "Chiclayo", "Piura", "Iquitos", "Huancayo", "Tacna", "Chimbote", "Puno", "Cajamarca"]
            },
            {
                flag: "🇸🇷",
                country: "Suriname",
                cities: ["Paramaribo", "Lelydorp", "Brokopondo", "Nieuw Nickerie", "Moengo", "Albina", "Wageningen", "Groningen", "Onverwacht", "Totness", "Mariënburg", "Brownsweg"]
            },
            {
                flag: "🇺🇾",
                country: "Uruguay",
                cities: ["Montevideo", "Salto", "Ciudad de la Costa", "Paysandú", "Las Piedras", "Rivera", "Maldonado", "Tacuarembó", "Melo", "Mercedes", "Artigas", "Punta del Este"]
            },
            {
                flag: "🇻🇪",
                country: "Venezuela",
                cities: ["Caracas", "Maracaibo", "Valencia", "Barquisimeto", "Maracay", "Ciudad Guayana", "Maturín", "Barcelona", "Puerto La Cruz", "Mérida", "Cumaná", "Porlamar"]
            }
        ];

        // State variables
        let searchQuery = "";
        let collapsedCountries = new Set();

        // DOM elements
        const countriesContainer = document.getElementById('countries-container');
        const searchInput = document.getElementById('search-input');
        const clearSearchBtn = document.getElementById('clear-search');
        const statCountries = document.getElementById('stat-countries');
        const statCities = document.getElementById('stat-cities');
        const noResults = document.getElementById('no-results');
        const darkToggle = document.getElementById('dark-toggle');
        const darkToggleMobile = document.getElementById('dark-toggle-mobile');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        // Theme Setup
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }

        darkToggle.addEventListener('click', toggleTheme);
        darkToggleMobile.addEventListener('click', toggleTheme);

        let toastTimeout;
        function showToast(text) {
            toastMessage.textContent = text;
            toast.classList.remove('translate-y-24', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 3000);
        }

        function copyText(text, isCity = true) {
            const formattedText = isCity ? `${text} driving tour` : text;
            
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(formattedText).then(() => {
                    showToast(`Copied '${formattedText}' to clipboard!`);
                }).catch(() => fallbackCopy(formattedText));
            } else {
                fallbackCopy(formattedText);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast(`Copied '${text}' to clipboard!`);
            } catch (err) {
                showToast('Failed to copy');
            }
            document.body.removeChild(textArea);
        }

        function copyAllCountryCities(countryName) {
            const countryObj = southAmericaData.find(c => c.country === countryName);
            if (!countryObj) return;
            const formattedList = countryObj.cities.map(c => `${c} driving tour`).join('\n');
            copyText(formattedList, false);
            showToast(`Copied all 12 cities for ${countryName}!`);
        }

        function openYouTubeSearch(query) {
            const encodedQuery = encodeURIComponent(`${query} driving tour`);
            window.open(`https://www.youtube.com/results?search_query=${encodedQuery}`, '_blank', 'noopener,noreferrer');
        }

        function toggleCountryCollapse(countryName) {
            if (collapsedCountries.has(countryName)) {
                collapsedCountries.delete(countryName);
            } else {
                collapsedCountries.add(countryName);
            }
            renderDashboard();
        }

        document.getElementById('expand-all-btn').addEventListener('click', () => {
            collapsedCountries.clear();
            renderDashboard();
        });

        document.getElementById('collapse-all-btn').addEventListener('click', () => {
            southAmericaData.forEach(c => collapsedCountries.add(c.country));
            renderDashboard();
        });

        function renderDashboard() {
            let visibleCountriesCount = 0;
            let visibleCitiesCount = 0;
            let html = '';

            const isSearching = searchQuery.trim().length > 0;
            const query = searchQuery.toLowerCase().trim();

            southAmericaData.forEach(countryData => {
                const countryMatches = countryData.country.toLowerCase().includes(query);
                const matchingCities = countryData.cities.filter(city => 
                    city.toLowerCase().includes(query) || countryMatches
                );

                if (matchingCities.length === 0) return;

                visibleCountriesCount++;
                visibleCitiesCount += matchingCities.length;

                // Open by default unless explicitly collapsed, or auto-expand on active search
                const isCollapsed = !isSearching && collapsedCountries.has(countryData.country);
                const escapedCountry = countryData.country.replace(/'/g, "\\'");

                html += `
                    <div class="bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm hover:shadow-md transition-all duration-200 overflow-hidden">
                        
                        <!-- Country Card Header -->
                        <div class="p-4 sm:p-5 bg-slate-50/60 dark:bg-slate-800/40 border-b border-slate-100 dark:border-slate-700/60 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                            
                            <div class="flex items-center space-x-3 cursor-pointer select-none" onclick="toggleCountryCollapse('${escapedCountry}')">
                                <button aria-label="Toggle collapse" class="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-sm transition-transform duration-200 ${isCollapsed ? '' : 'rotate-90'}">
                                    <i class="fa-solid fa-chevron-right"></i>
                                </button>
                                <span class="text-2xl">${countryData.flag}</span>
                                <div class="flex items-center space-x-2">
                                    <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100">${countryData.country}</h2>
                                    <span class="px-2.5 py-0.5 text-xs font-semibold bg-emerald-100 dark:bg-emerald-950/80 text-emerald-700 dark:text-emerald-300 rounded-full">
                                        ${matchingCities.length} ${matchingCities.length === 1 ? 'city' : 'cities'}
                                    </span>
                                </div>
                            </div>

                            <!-- Country Direct Action Buttons -->
                            <div class="flex items-center gap-2">
                                <button onclick="copyAllCountryCities('${escapedCountry}')" 
                                    class="flex-1 sm:flex-initial px-3.5 py-2 text-xs font-semibold bg-white dark:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-600 rounded-xl transition-colors flex items-center justify-center gap-2 shadow-xs">
                                    <i class="fa-regular fa-copy text-slate-400"></i> Copy All Cities
                                </button>
                                <button onclick="openYouTubeSearch('${escapedCountry}')" 
                                    class="flex-1 sm:flex-initial px-3.5 py-2 text-xs font-semibold bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-900/50 hover:bg-red-100 dark:hover:bg-red-900/60 rounded-xl transition-colors flex items-center justify-center gap-2 shadow-xs">
                                    <i class="fa-brands fa-youtube text-red-500"></i> Driving Tour
                                </button>
                            </div>
                        </div>

                        <!-- City Grid Content -->
                        <div class="${isCollapsed ? 'hidden' : 'block'} p-4 sm:p-5">
                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                                ${matchingCities.map(city => {
                                    const escapedCity = city.replace(/'/g, "\\'");
                                    return `
                                        <div class="group relative flex items-center justify-between p-3 rounded-xl bg-slate-50/80 dark:bg-slate-900/50 hover:bg-emerald-50/60 dark:hover:bg-slate-700/60 border border-slate-200/60 dark:border-slate-800 transition-all duration-150">
                                            
                                            <!-- City Name (Clickable to copy with 'driving tour') -->
                                            <button onclick="copyText('${escapedCity}', true)" 
                                                title="Click to copy '${city} driving tour'" 
                                                class="flex-1 text-left font-medium text-xs sm:text-sm text-slate-700 dark:text-slate-200 hover:text-emerald-600 dark:hover:text-emerald-400 truncate mr-2 flex items-center gap-1.5">
                                                <i class="fa-solid fa-location-dot text-slate-300 dark:text-slate-600 text-xs"></i>
                                                <span class="truncate">${city}</span>
                                            </button>

                                            <!-- City Action Buttons -->
                                            <div class="flex items-center space-x-1 shrink-0">
                                                <button onclick="copyText('${escapedCity}', true)" 
                                                    title="Copy '${city} driving tour'"
                                                    class="p-1.5 text-slate-400 hover:text-slate-700 dark:hover:text-slate-100 hover:bg-white dark:hover:bg-slate-800 rounded-lg transition-colors text-xs">
                                                    <i class="fa-regular fa-copy"></i>
                                                </button>
                                                <button onclick="openYouTubeSearch('${escapedCity}')" 
                                                    title="Search '${city} driving tour' on YouTube"
                                                    class="p-1.5 text-red-500 hover:text-red-600 dark:text-red-400 hover:bg-white dark:hover:bg-slate-800 rounded-lg transition-colors text-xs">
                                                    <i class="fa-brands fa-youtube"></i>
                                                </button>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
            });

            countriesContainer.innerHTML = html;

            // Update stats counter
            statCountries.textContent = visibleCountriesCount;
            statCities.textContent = visibleCitiesCount;

            // Handle empty state visibility
            if (visibleCountriesCount === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
            }
        }

        // Search Input listeners
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            if (searchQuery.trim().length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }
            renderDashboard();
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            clearSearchBtn.classList.add('hidden');
            renderDashboard();
        });

        // Initialize App on DOM Load
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderDashboard();
        });
    </script>
</body>
</html>
