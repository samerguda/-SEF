            --text-arabic: #27ae60;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .controls {
            position: sticky;
            top: 10px;
            z-index: 100;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 25px;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #1c5980;
        }

        .section-title {
            background-color: var(--primary);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            margin-top: 30px;
            font-size: 1.3rem;
        }

        .category-title {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 5px;
            margin-top: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .card {
            background: var(--card-bg);
            border-left: 5px solid var(--accent);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .dutch-text {
            font-weight: bold;
            font-size: 1.05rem;
            color: #333;
            margin-bottom: 8px;
            direction: ltr;
        }

        .arabic-text {
            color: var(--text-arabic);
            font-size: 1.05rem;
            direction: rtl;
            text-align: right;
            font-family: 'Tahoma', sans-serif;
            transition: opacity 0.3s;
        }

        .hidden {
            opacity: 0;
            user-select: none;
        }

        .note-card {
            background: #fff8e1;
            border-left-color: #f39c12;
        }
    </style>
</head>

                        ar: "لشراء بطاقة UiTPAS بسعر مخفض (Kansentarief)، يمكنك التوجه إلى 'بيت رفاهية المجتمع' (Huis van Welzijn)." 
                    },
                    { 
                        nl: "Een bewijs van een polio-inenting mag je zonder afspraak komen binnenbrengen op het stadhuis of buiten de openingstijden in de brievenbus deponeren.", 
                        ar: "يمكنك تسليم إثبات التطعيم ضد شلل الأطفال بدون موعد في البلدية، أو وضعه في صندوق البريد خارج أوقات العمل." 
                    }
                ]
            }
        ]
    }
];

function renderContent() {
    const container = document.getElementById('contentContainer');
    container.innerHTML = '';

    data.forEach(sec => {
        const secTitle = document.createElement('div');
        secTitle.className = 'section-title';
        secTitle.innerText = sec.section;
        container.appendChild(secTitle);

        sec.categories.forEach(cat => {
            const catTitle = document.createElement('h3');
            catTitle.className = 'category-title';
            catTitle.innerText = cat.name;
            container.appendChild(catTitle);

            const grid = document.createElement('div');
            grid.className = 'grid';

            cat.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card' + (sec.section.includes("Zonder afspraak") ? ' note-card' : '');

                card.innerHTML = `
                    <div class="dutch-text">${item.nl}</div>
                    <div class="arabic-text">${item.ar}</div>
                `;
                grid.appendChild(card);
            });

            container.appendChild(grid);
        });
    });
}

function toggleTranslations() {
    const arabicTexts = document.querySelectorAll('.arabic-text');
    arabicTexts.forEach(el => {
        el.classList.toggle('hidden');
    });
}

document.getElementById('searchInput').addEventListener('input', function(e) {
    const term = e.target.value.toLowerCase();
    const cards = document.querySelectorAll('.card');

    cards.forEach(card => {
        const dutch = card.querySelector('.dutch-text').innerText.toLowerCase();
        const arabic = card.querySelector('.arabic-text').innerText.toLowerCase();

        if (dutch.includes(term) || arabic.includes(term)) {
            card.style.display = 'flex';
        } else {
            card.style.display = 'none';
        }
    });
});

renderContent();
</script>

</body>
</html>
