        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }

        darkToggle.addEventListener('click', toggleTheme);
        darkToggleMobile.addEventListener('click', toggleTheme);

        let toastTimeout;
        function showToast(message) {
            toastMessage.textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(`Copied: "${text}"!`);
                }).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast(`Copied: "${text}"!`);
            } catch (err) {
                showToast('Failed to copy text');
            }
            document.body.removeChild(textArea);
        }

        function openDrivingTour(locationName) {
            const query = encodeURIComponent(`${locationName} driving tour`);
            const searchUrl = `https://www.youtube.com/results?search_query=${query}`;
            
            // Set up YouTube Search Embed / Link
            modalTitle.textContent = `${locationName} - Driving Tour`;
            // Youtube search video embed workaround via search embed URL format
            videoIframe.src = `https://www.youtube.com/embed?listType=search&list=${query}&autoplay=1`;
            externalYtLink.href = searchUrl;

            // Show Modal
            videoModal.classList.remove('opacity-0', 'pointer-events-none');
            videoModal.classList.add('opacity-100');
            videoModalCard.classList.remove('scale-95');
            videoModalCard.classList.add('scale-100');
        }

        function closeModal() {
            videoModal.classList.remove('opacity-100');
            videoModal.classList.add('opacity-0', 'pointer-events-none');
            videoModalCard.classList.remove('scale-100');
            videoModalCard.classList.add('scale-95');
            videoIframe.src = '';
        }

        closeModalBtn.addEventListener('click', closeModal);
        videoModal.addEventListener('click', (e) => {
            if (e.target === videoModal) closeModal();
        });

        function renderRegionFilters() {
            const regions = ["All", ...travelData.map(r => r.region)];
            regionFilters.innerHTML = regions.map(reg => `
                <button onclick="setRegion('${reg}')" 
                    class="px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${
                        selectedRegion === reg 
                        ? 'bg-sky-600 text-white shadow-md shadow-sky-500/20' 
                        : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/60 border border-slate-200 dark:border-slate-800'
                    }">
                    ${reg}
                </button>
            `).join('');
        }

        function setRegion(region) {
            selectedRegion = region;
            renderRegionFilters();
            renderDestinations();
        }

        function toggleCountry(countryName) {
            if (openCountries.has(countryName)) {
                openCountries.delete(countryName);
            } else {
                openCountries.add(countryName);
            }
            renderDestinations();
        }

        document.getElementById('expand-all-btn').addEventListener('click', () => {
            travelData.forEach(r => r.countries.forEach(c => openCountries.add(c.name)));
            renderDestinations();
        });

        document.getElementById('collapse-all-btn').addEventListener('click', () => {
            openCountries.clear();
            renderDestinations();
        });

        function renderDestinations() {
            let totalCountries = 0;
            let totalCities = 0;
            let html = '';

            const isSearching = searchQuery.trim().length > 0;
            const query = searchQuery.toLowerCase().trim();

            travelData.forEach(regionBlock => {
                // Check region filter
                if (selectedRegion !== "All" && selectedRegion !== regionBlock.region) return;

                // Filter countries & cities based on query
                const filteredCountries = regionBlock.countries.filter(c => {
                    const countryMatches = c.name.toLowerCase().includes(query);
                    const cityMatches = c.cities.some(city => city.toLowerCase().includes(query));
                    return countryMatches || cityMatches;
                });

                if (filteredCountries.length === 0) return;

                html += `
                    <div class="space-y-4">
                        <div class="flex items-center gap-3">
                            <h2 class="text-xl font-bold tracking-tight text-slate-800 dark:text-slate-100">${regionBlock.region}</h2>
                            <span class="px-2.5 py-0.5 text-xs font-semibold bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 rounded-full">
                                ${filteredCountries.length} countries
                            </span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                `;

                filteredCountries.forEach(country => {
                    totalCountries++;
                    const matchingCities = isSearching 
                        ? country.cities.filter(city => city.toLowerCase().includes(query) || country.name.toLowerCase().includes(query))
                        : country.cities;

                    totalCities += matchingCities.length;

                    // If user is searching, automatically show city details
                    const isOpen = isSearching || openCountries.has(country.name);

                    html += `
                        <div class="bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/60 rounded-2xl shadow-sm hover:shadow-md transition-all duration-200 flex flex-col overflow-hidden">
                            <!-- Country Header -->
                            <div class="p-4 bg-slate-50/50 dark:bg-slate-800/40 border-b border-slate-100 dark:border-slate-700/50 flex flex-col justify-between gap-3">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-2 cursor-pointer select-none" onclick="toggleCountry('${country.name}')">
                                        <button class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xs transition-transform duration-200 ${isOpen ? 'rotate-90' : ''}">
                                            <i class="fa-solid fa-chevron-right"></i>
                                        </button>
                                        <h3 class="font-bold text-slate-800 dark:text-slate-100 text-base">${country.name}</h3>
                                        <span class="text-xs text-slate-400 font-normal">(${country.cities.length})</span>
                                    </div>
                                </div>

                                <!-- Country Actions -->
                                <div class="flex items-center gap-2">
                                    <button onclick="copyToClipboard('${country.name}')" 
                                        class="flex-1 px-3 py-1.5 text-xs font-medium bg-white dark:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-600 rounded-lg transition-colors flex items-center justify-center gap-1.5">
                                        <i class="fa-regular fa-copy"></i> Copy Country
                                    </button>
                                    <button onclick="openDrivingTour('${country.name}')" 
                                        class="flex-1 px-3 py-1.5 text-xs font-medium bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-900/50 hover:bg-red-100 dark:hover:bg-red-900/60 rounded-lg transition-colors flex items-center justify-center gap-1.5">
                                        <i class="fa-brands fa-youtube"></i> Driving Tour
                                    </button>
                                </div>
                            </div>

                            <!-- Cities Container (Collapsible) -->
                            <div class="${isOpen ? 'block' : 'hidden'} p-4 flex-1">
                                <div class="grid grid-cols-1 gap-2">
                                    ${matchingCities.map(city => `
                                        <div class="group flex items-center justify-between p-2 rounded-xl bg-slate-50/80 dark:bg-slate-900/40 hover:bg-sky-50/60 dark:hover:bg-slate-700/40 border border-slate-100 dark:border-slate-800 transition-colors">
                                            <span class="text-xs font-semibold text-slate-700 dark:text-slate-300 ml-1">${city}</span>
                                            <div class="flex items-center gap-1 opacity-90 sm:opacity-0 group-hover:opacity-100 transition-opacity">
                                                <button onclick="copyToClipboard('${city.replace(/'/g, "\\'")} driving tour')" 
                                                    title="Copy city driving tour string"
                                                    class="p-1.5 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-100 hover:bg-white dark:hover:bg-slate-700 rounded-md transition-colors text-xs">
                                                    <i class="fa-regular fa-copy"></i>
                                                </button>
                                                <button onclick="openDrivingTour('${city.replace(/'/g, "\\'")}, ${country.name.replace(/'/g, "\\'")}')" 
                                                    title="Watch driving tour"
                                                    class="p-1.5 text-red-500 hover:text-red-600 dark:text-red-400 hover:bg-white dark:hover:bg-slate-700 rounded-md transition-colors text-xs">
                                                    <i class="fa-brands fa-youtube"></i>
                                                </button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            destinationsContainer.innerHTML = html;

            // Stats update
            statsCounter.innerHTML = `Showing <span class="font-bold text-sky-600 dark:text-sky-400">${totalCountries}</span> countries & <span class="font-bold text-sky-600 dark:text-sky-400">${totalCities}</span> cities`;

            // Toggle No Results
            if (totalCountries === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
            }
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            if (searchQuery.trim().length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }
            renderDestinations();
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            clearSearchBtn.classList.add('hidden');
            renderDestinations();
        });

        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderRegionFilters();
            renderDestinations();
        });
    </script>
</body>
</html>
